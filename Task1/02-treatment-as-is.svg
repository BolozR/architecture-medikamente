<rect x="835.5" y="471" width="129" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="900" y="481.55" dominant-baseline="middle">Отметка о приёме,</tspan>
