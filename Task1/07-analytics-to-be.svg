<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="900" y="146.55" dominant-baseline="middle">Вход и отказ</tspan>
<tspan x="900" y="163.45" dominant-baseline="middle">шифрование</tspan>
</text>
<rect x="832" y="311" width="136" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="900" y="321.55" dominant-baseline="middle">Вход для повторной</tspan>
<tspan x="900" y="338.45" dominant-baseline="middle">классификации</tspan>
</text>
<rect x="369" y="471" width="122" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="430" y="481.55" dominant-baseline="middle">Запрос к витрине</tspan>
<tspan x="430" y="498.45" dominant-baseline="middle">TLS, RBAC</tspan>
</text>
<rect x="372.5" y="696" width="115" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
