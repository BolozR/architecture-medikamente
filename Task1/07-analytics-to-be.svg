<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="24" font-weight="bold" fill="#454545">
<tspan x="710" y="40" dominant-baseline="middle">Отчёты и аналитика — To-Be</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="normal" fill="#454545">
<tspan x="710" y="90.5" dominant-baseline="middle">DFD процесса • предлагаемые данные, ограничения доступа и защита</tspan>
</text>
<rect x="60" y="200" width="300" height="140" rx="12" fill="#8C8498" stroke="#7B7387" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="210" y="270" dominant-baseline="middle">Источники / экспорт</tspan>
</text>
<rect x="500" y="200" width="300" height="140" rx="12" fill="#1565AD" stroke="#10528F" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="650" y="251" dominant-baseline="middle">P1. Classifier</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="15" font-weight="normal" fill="#DBE6F0">
<tspan x="650" y="272.5" dominant-baseline="middle">Схема, теги, цель</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="15" font-weight="normal" fill="#DBE6F0">
<tspan x="650" y="291.5" dominant-baseline="middle">Неизвестное → карантин</tspan>
</text>
<rect x="1000" y="200" width="300" height="140" fill="#1565AD"/><path d="M 1300 200 H 1000 V 340 H 1300" fill="none" stroke="#10528F" stroke-width="1.4"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="1150" y="251" dominant-baseline="middle">D1. Landing / quarantine</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="15" font-weight="normal" fill="#DBE6F0">
<tspan x="1150" y="272.5" dominant-baseline="middle">Закрытые объекты</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="15" font-weight="normal" fill="#DBE6F0">
<tspan x="1150" y="291.5" dominant-baseline="middle">Шифрование, TTL</tspan>
</text>
<rect x="60" y="530" width="300" height="140" rx="30" fill="#0B4073" stroke="#0B4073" stroke-width="1"/>
<circle cx="210" cy="514" r="43" fill="#0B4073" stroke="#0B4073" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="210" y="600" dominant-baseline="middle">Аналитик / BI</tspan>
</text>
<rect x="500" y="530" width="300" height="140" rx="12" fill="#1565AD" stroke="#10528F" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="650" y="581" dominant-baseline="middle">P2. Минимизировать</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="15" font-weight="normal" fill="#DBE6F0">
<tspan x="650" y="602.5" dominant-baseline="middle">и построить агрегаты</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="15" font-weight="normal" fill="#DBE6F0">
<tspan x="650" y="621.5" dominant-baseline="middle">Связи, укрупнение групп</tspan>
</text>
<rect x="1000" y="530" width="300" height="140" fill="#1565AD"/><path d="M 1300 530 H 1000 V 670 H 1300" fill="none" stroke="#10528F" stroke-width="1.4"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="1150" y="581" dominant-baseline="middle">D2. Restricted / curated</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="15" font-weight="normal" fill="#DBE6F0">
<tspan x="1150" y="602.5" dominant-baseline="middle">Раздельные роли и ключи</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="15" font-weight="normal" fill="#DBE6F0">
<tspan x="1150" y="621.5" dominant-baseline="middle">MEDICAL / INTERNAL</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="normal" fill="#454545">
<tspan x="680" y="812.5" dominant-baseline="middle">As-Is: показан предполагаемый путь ручного отчёта. To-Be: BI не читает landing и медицинский restricted.</tspan>
</text>
<rect x="407.5" y="136" width="45" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="430" y="146.55" dominant-baseline="middle">Пакет</tspan>
<tspan x="430" y="163.45" dominant-baseline="middle">TLS</tspan>
</text>
