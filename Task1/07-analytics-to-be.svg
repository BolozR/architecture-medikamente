<tspan x="430" y="723.45" dominant-baseline="middle">контроль выдачи</tspan>
</text>
<rect x="839" y="471" width="122" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="900" y="481.55" dominant-baseline="middle">Защищённый набор</tspan>
<tspan x="900" y="498.45" dominant-baseline="middle">и агрегаты</tspan>
</text>
<rect x="856.5" y="696" width="87" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="900" y="706.55" dominant-baseline="middle">Разрешённая</tspan>
<tspan x="900" y="723.45" dominant-baseline="middle">витрина</tspan>
</text>
<rect x="728.5" y="386" width="143" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="800" y="396.55" dominant-baseline="middle">Только прошедший</tspan>
<tspan x="800" y="413.45" dominant-baseline="middle">классификацию пакет</tspan>
