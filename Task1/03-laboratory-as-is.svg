<tspan x="477" y="742" dominant-baseline="middle">МЕДИКАМЕНТЕ  [Процесс и данные]</tspan>
</text>
<polyline points="360,240 500,240" fill="none" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="800,240 1000,240" fill="none" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="1000,300 800,300" fill="none" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="360,570 500,570" fill="none" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="500,635 360,635" fill="none" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="800,570 1000,570" fill="none" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="1000,630 800,630" fill="none" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="1000,315 935,315 935,435 650,435 650,530" fill="none" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="24" font-weight="bold" fill="#454545">
<tspan x="710" y="40" dominant-baseline="middle">Лабораторные анализы — As-Is</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="normal" fill="#454545">
<tspan x="710" y="90.5" dominant-baseline="middle">DFD процесса • по описанию компании; неизвестные детали отмечены отдельно</tspan>
</text>
<rect x="60" y="200" width="300" height="140" rx="30" fill="#0B4073" stroke="#0B4073" stroke-width="1"/>
<circle cx="210" cy="184" r="43" fill="#0B4073" stroke="#0B4073" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="210" y="270" dominant-baseline="middle">Врач / пациент</tspan>
</text>
<rect x="500" y="200" width="300" height="140" rx="12" fill="#1565AD" stroke="#10528F" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="650" y="260.5" dominant-baseline="middle">P1. Оформить направление</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="15" font-weight="normal" fill="#DBE6F0">
<tspan x="650" y="282" dominant-baseline="middle">и зарегистрировать анализ</tspan>
</text>
<rect x="1000" y="200" width="300" height="140" fill="#1565AD"/><path d="M 1300 200 H 1000 V 340 H 1300" fill="none" stroke="#10528F" stroke-width="1.4"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="1150" y="260.5" dominant-baseline="middle">D1. RegistryByDate</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="15" font-weight="normal" fill="#DBE6F0">
<tspan x="1150" y="282" dominant-baseline="middle">Excel-реестр анализов</tspan>
</text>
<rect x="60" y="530" width="300" height="140" rx="12" fill="#8C8498" stroke="#7B7387" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="210" y="600" dominant-baseline="middle">Лаборатория</tspan>
</text>
<rect x="500" y="530" width="300" height="140" rx="12" fill="#1565AD" stroke="#10528F" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="650" y="590.5" dominant-baseline="middle">P2. Передать направление</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="15" font-weight="normal" fill="#DBE6F0">
<tspan x="650" y="612" dominant-baseline="middle">и принять результат вручную</tspan>
</text>
<rect x="1000" y="530" width="300" height="140" fill="#1565AD"/><path d="M 1300 530 H 1000 V 670 H 1300" fill="none" stroke="#10528F" stroke-width="1.4"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="1150" y="590.5" dominant-baseline="middle">D2. Результаты в папке</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="15" font-weight="normal" fill="#DBE6F0">
<tspan x="1150" y="612" dominant-baseline="middle">пациента: Excel / PDF</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="normal" fill="#454545">
<tspan x="680" y="812.5" dominant-baseline="middle">As-Is: точный канал ручного обмена не указан. To-Be: нет поиска всех пациентов через API лаборатории.</tspan>
</text>
<rect x="372.5" y="136" width="115" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="430" y="146.55" dominant-baseline="middle">Назначение,</tspan>
<tspan x="430" y="163.45" dominant-baseline="middle">данные пациента</tspan>
</text>
<rect x="839" y="136" width="122" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="900" y="146.55" dominant-baseline="middle">Анализ, пациент,</tspan>
<tspan x="900" y="163.45" dominant-baseline="middle">дата</tspan>
</text>
<rect x="856.5" y="311" width="87" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="900" y="321.55" dominant-baseline="middle">Реестр</tspan>
<tspan x="900" y="338.45" dominant-baseline="middle">направлений</tspan>
</text>
<rect x="393.5" y="479.5" width="73" height="21" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="430" y="490" dominant-baseline="middle">Результат</tspan>
</text>
<rect x="386.5" y="704.5" width="87" height="21" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="430" y="715" dominant-baseline="middle">Направление</tspan>
</text>
<rect x="839" y="471" width="122" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="900" y="481.55" dominant-baseline="middle">Результат, связь</tspan>
<tspan x="900" y="498.45" dominant-baseline="middle">с пациентом</tspan>
</text>
<rect x="839" y="696" width="122" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="900" y="706.55" dominant-baseline="middle">Ранее полученный</tspan>
<tspan x="900" y="723.45" dominant-baseline="middle">результат</tspan>
</text>
<rect x="749.5" y="386" width="101" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="800" y="396.55" dominant-baseline="middle">Сведения</tspan>
<tspan x="800" y="413.45" dominant-baseline="middle">о направлении</tspan>
</text>
