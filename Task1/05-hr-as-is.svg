<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="890" viewBox="0 0 1420 890">
<title>Кадры и зарплата — As-Is</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8A8A"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="465" y="175" width="875" height="580" rx="10" fill="none" stroke="#8A8A8A" stroke-width="1.2" stroke-dasharray="8 5"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-size="14" font-weight="bold" fill="#454545">
<tspan x="477" y="742" dominant-baseline="middle">МЕДИКАМЕНТЕ  [Процесс и данные]</tspan>
</text>
<polyline points="360,240 500,240" fill="none" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="800,240 1000,240" fill="none" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="1000,300 800,300" fill="none" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="360,570 500,570" fill="none" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="500,635 360,635" fill="none" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="800,570 1000,570" fill="none" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="1000,630 800,630" fill="none" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="1000,315 935,315 935,435 650,435 650,530" fill="none" stroke="#8A8A8A" stroke-width="1.2" marker-end="url(#arrow)"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="24" font-weight="bold" fill="#454545">
<tspan x="710" y="40" dominant-baseline="middle">Кадры и зарплата — As-Is</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="normal" fill="#454545">
<tspan x="710" y="90.5" dominant-baseline="middle">DFD процесса • по описанию компании; неизвестные детали отмечены отдельно</tspan>
</text>
<rect x="60" y="200" width="300" height="140" rx="30" fill="#0B4073" stroke="#0B4073" stroke-width="1"/>
<circle cx="210" cy="184" r="43" fill="#0B4073" stroke="#0B4073" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="210" y="270" dominant-baseline="middle">Сотрудник</tspan>
</text>
<rect x="500" y="200" width="300" height="140" rx="12" fill="#1565AD" stroke="#10528F" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="650" y="260.5" dominant-baseline="middle">P1. Бухгалтер принимает</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="15" font-weight="normal" fill="#DBE6F0">
<tspan x="650" y="282" dominant-baseline="middle">кадровые сведения</tspan>
</text>
<rect x="1000" y="200" width="300" height="140" fill="#1565AD"/><path d="M 1300 200 H 1000 V 340 H 1300" fill="none" stroke="#10528F" stroke-width="1.4"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="1150" y="260.5" dominant-baseline="middle">D1. 1С:Бухгалтерия</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="15" font-weight="normal" fill="#DBE6F0">
<tspan x="1150" y="282" dominant-baseline="middle">Кадры и начисления</tspan>
</text>
<rect x="60" y="530" width="300" height="140" rx="30" fill="#0B4073" stroke="#0B4073" stroke-width="1"/>
<circle cx="210" cy="514" r="43" fill="#0B4073" stroke="#0B4073" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="210" y="600" dominant-baseline="middle">Бухгалтер</tspan>
</text>
<rect x="500" y="530" width="300" height="140" rx="12" fill="#1565AD" stroke="#10528F" stroke-width="1"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="650" y="590.5" dominant-baseline="middle">P2. Рассчитать выплаты</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="15" font-weight="normal" fill="#DBE6F0">
<tspan x="650" y="612" dominant-baseline="middle">и подготовить отчёты</tspan>
</text>
<rect x="1000" y="530" width="300" height="140" fill="#1565AD"/><path d="M 1300 530 H 1000 V 670 H 1300" fill="none" stroke="#10528F" stroke-width="1.4"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
<tspan x="1150" y="590.5" dominant-baseline="middle">D2. Зарплатные</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="15" font-weight="normal" fill="#DBE6F0">
<tspan x="1150" y="612" dominant-baseline="middle">и налоговые документы</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="normal" fill="#454545">
<tspan x="680" y="812.5" dominant-baseline="middle">Способ передачи исходных кадровых сведений и точный формат отчётов в условии не описаны.</tspan>
</text>
<rect x="372.5" y="136" width="115" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="430" y="146.55" dominant-baseline="middle">Реквизиты,</tspan>
<tspan x="430" y="163.45" dominant-baseline="middle">кадровые данные</tspan>
</text>
<rect x="860" y="136" width="80" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="900" y="146.55" dominant-baseline="middle">Карточка</tspan>
<tspan x="900" y="163.45" dominant-baseline="middle">сотрудника</tspan>
</text>
<rect x="849.5" y="311" width="101" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="900" y="321.55" dominant-baseline="middle">Сведения</tspan>
<tspan x="900" y="338.45" dominant-baseline="middle">для уточнения</tspan>
</text>
<rect x="390" y="471" width="80" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="430" y="481.55" dominant-baseline="middle">Период,</tspan>
<tspan x="430" y="498.45" dominant-baseline="middle">начисления</tspan>
</text>
<rect x="400.5" y="696" width="59" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="430" y="706.55" dominant-baseline="middle">Расчёт,</tspan>
<tspan x="430" y="723.45" dominant-baseline="middle">отчёты</tspan>
</text>
<rect x="860" y="471" width="80" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="900" y="481.55" dominant-baseline="middle">Выплаты,</tspan>
<tspan x="900" y="498.45" dominant-baseline="middle">отчётность</tspan>
</text>
<rect x="870.5" y="696" width="59" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="900" y="706.55" dominant-baseline="middle">Прежние</tspan>
<tspan x="900" y="723.45" dominant-baseline="middle">расчёты</tspan>
</text>
<rect x="732" y="386" width="136" height="38" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#454545">
<tspan x="800" y="396.55" dominant-baseline="middle">Данные сотрудников</tspan>
<tspan x="800" y="413.45" dominant-baseline="middle">и начислений</tspan>
</text>
</svg>